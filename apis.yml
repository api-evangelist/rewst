apis:
- name: Rewst Webhook Triggers
  description: >-
    Inbound custom webhook triggers that start Rewst workflows. An external system sends an HTTP
    request (method configured per trigger) to a per-trigger URL; the normalized payload
    ({body, headers, method, params, timestamp}) is exposed to the workflow via context
    variables. Optional shared-secret authentication via the x-rewst-secret header; rate limited
    to 50 req/s and 1000 req/min per trigger.
  humanURL: https://docs.rewst.help/documentation/automations/intro-to-triggers/use-cases-and-examples/using-webhook-triggers.md
  baseURL: https://engine.rewst.io

aid: rewst
name: Rewst
description: >-
  Rewst is a workflow automation and integration (iPaaS/RPA) platform built specifically for
  managed service providers (MSPs). It combines a visual workflow builder, a form builder, an
  app builder, 90+ managed MSP integrations (PSA, RMM, Microsoft 365, security tools), reusable
  automation packages called Crates, and RoboRewsty, an AI assistant, so MSP teams can automate
  repetitive operational tasks. Rewst's primary programmatic surface is inbound custom webhook
  triggers that start workflows, authenticated with an optional x-rewst-secret header and rate
  limited per trigger; it also offers a Generic GraphQL request action for calling external
  APIs from within workflows. Rewst is SOC 2 Type 2 compliant, publishes a live status page,
  and runs a Bugcrowd vulnerability-disclosure program. Backed by Sapphire Ventures.
